[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adk-collaboration"
version = "0.1.0"
description = "Experimental supervised collaboration for Google ADK agents"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["google-adk>=2.12,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
