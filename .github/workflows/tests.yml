name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra test
      - run: uv run --no-sync ruff check src tests examples benchmarks
      - run: uv run --no-sync ruff format --check src tests examples benchmarks
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python examples/team_demo.py
      - run: uv run --no-sync python benchmarks/worker_capacity.py --repeats 2 --delay 0.05
